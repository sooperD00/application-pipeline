# .pre-commit-config.yaml   (one-time uv tool install pre-commit && pre-commit install)
repos
  - repo local
    hooks
      - id sync-dockerignore
        name .dockerignore = .gitignore + .dockerignore.extra
        entry python scriptssync_dockerignore.py
        language python
        pass_filenames false
        always_run true  # the leak check reads the working tree, not just changed files